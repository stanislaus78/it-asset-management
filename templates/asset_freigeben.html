<!DOCTYPE html>
<html>
<head>
    <title>Asset freigeben</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container" style="max-width: 480px;">

    <h1>🔓 Asset freigeben</h1>

    {% if ergebnis %}
    <p style="padding: 10px 14px; background: #eef3f8; border-radius: 8px;">{{ ergebnis }}</p>
    {% endif %}

    <form method="post">
        <p>
            <label>Inventarnummer</label><br>
            <input type="text" name="inventarnummer" value="{{ inventarnummer }}"
                   style="width: 100%; padding: 8px;" autofocus>
        </p>

        <button style="padding: 8px 20px;">Freigeben</button>
    </form>

    <p><a href="/assets">⬅️ Zurück zu Assets</a></p>

</div>

</body>
</html>
