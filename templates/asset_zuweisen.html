<!DOCTYPE html>
<html>
<head>
    <title>Asset zuweisen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container" style="max-width: 480px;">

    <h1>🎒 Asset zuweisen</h1>

    {% if ergebnis %}
    <p style="padding: 10px 14px; background: #eef3f8; border-radius: 8px;">{{ ergebnis }}</p>
    {% endif %}

    <form method="post">
        <p>
            <label>Inventarnummer</label><br>
            <input type="text" name="inventarnummer" value="{{ inventarnummer }}"
                   style="width: 100%; padding: 8px;" autofocus>
        </p>

        <p>
            <label>Mitarbeiter</label><br>
            <select name="mitarbeiter" style="width: 100%; padding: 8px;">
                <option value="">Bitte wählen</option>
                {% for uaccountid, vorname, nachname in mitarbeiter_liste %}
                {% if uaccountid == mitarbeiter %}
                <option value="{{ uaccountid }}" selected>{{ vorname }} {{ nachname }} ({{ uaccountid }})</option>
                {% else %}
                <option value="{{ uaccountid }}">{{ vorname }} {{ nachname }} ({{ uaccountid }})</option>
                {% endif %}
                {% endfor %}
            </select>
        </p>

        <button style="padding: 8px 20px;">Zuweisen</button>
    </form>

    <p><a href="/assets">⬅️ Zurück zu Assets</a></p>

</div>

</body>
</html>
