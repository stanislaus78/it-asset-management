{% extends "base.html" %}
{% block titel %}Assets{% endblock %}

{% block inhalt %}
    <div class="pfad"><a href="/">Start</a> › Assets</div>
    <h1>Assets</h1>

    <div class="kacheln">
        {% for titel, link, symbol, anzahl in kacheln %}
        <a class="kachel-karte" href="{{ link }}">
            <h2>{{ symbol }} {{ titel }}</h2>
               <div class="hinweis">{{ anzahl }} {{ 'Asset' if anzahl == 1 else 'Assets' }}</div>
        </a>
        {% endfor %}
    </div>

    <p><a href="/suche/asset">Asset suchen</a> · <a href="/historie">Historie</a></p>
{% endblock %}
