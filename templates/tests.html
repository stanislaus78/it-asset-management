<!DOCTYPE html>
<html>
<head>
    <title>Tests</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">

    <h1>🧪 Automatische Tests</h1>

    <p>Prüft Anmeldung, Rechte, Asset-Seiten, Anlegen, Löschen, Zuweisen, Mitarbeiter und Import.
       Die Tests laufen auf einer temporären Datenbank, deine Daten bleiben unverändert.</p>

    <button id="startKnopf" onclick="testsStarten()">▶ Tests starten</button>

    <div id="ergebnis" style="display:none; margin-top:20px;">
        <div id="banner" style="padding:12px 16px; border-radius:6px; font-weight:bold;"></div>
        <details style="margin-top:12px;">
            <summary>Vollständige Ausgabe</summary>
            <pre id="ausgabe" style="background:#f4f4f4; padding:12px; overflow:auto; max-height:500px;"></pre>
        </details>
    </div>

    <br><br>
    <p><a href="/administration">⬅️ Zurück zur Administration</a></p>

</div>

<script>
function testsStarten() {
    const knopf = document.getElementById("startKnopf");
    const bereich = document.getElementById("ergebnis");
    const banner = document.getElementById("banner");

    knopf.disabled = true;
    knopf.innerText = "⏳ Tests laufen …";
    bereich.style.display = "block";
    banner.style.background = "#eee";
    banner.style.color = "#333";
    banner.innerText = "Bitte warten, der Lauf dauert etwa 10 bis 20 Sekunden.";
    document.getElementById("ausgabe").innerText = "";

    fetch("/administration/tests/starten", { method: "POST" })
    .then(r => r.json().catch(() => ({
        status: "fehler", meldung: "Server antwortete mit Status " + r.status
    })))
    .then(data => {
        if (data.status === "fehler") {
            banner.style.background = "#fde2e2";
            banner.style.color = "#a40000";
            banner.innerText = "⚠️ " + data.meldung;
            return;
        }
        banner.style.background = data.bestanden ? "#dff5e1" : "#fde2e2";
        banner.style.color = data.bestanden ? "#14661f" : "#a40000";
        banner.innerText = (data.bestanden ? "✅ " : "❌ ") + data.zusammenfassung
            + "  (" + data.dauer + " s)";
        document.getElementById("ausgabe").innerText = data.ausgabe;
        if (!data.bestanden) {
            document.querySelector("#ergebnis details").open = true;
        }
    })
    .catch(fehler => {
        banner.style.background = "#fde2e2";
        banner.style.color = "#a40000";
        banner.innerText = "⚠️ Testlauf fehlgeschlagen: " + fehler.message;
    })
    .finally(() => {
        knopf.disabled = false;
        knopf.innerText = "▶ Tests starten";
    });
}
</script>
</body>
</html>
