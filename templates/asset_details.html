<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asset Details</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
        <h1>💻 {{ asset[0] }}</h1>


        <table border="1">

            <tr>
                <th>Eigenschaft</th>
                <th>Wert</th>
            </tr>

            <tr>
                <td>Inventarnummer</td>
                <td>{{ asset[0] }}</td>
            </tr>

            <tr>
                <td>Hersteller</td>
                <td>{{ asset[1] }}</td>
            </tr>

            <tr>
                <td>Status</td>
                <td>{{ asset[2] }}</td>
            </tr>

            <tr>
                <td>Gerätetyp</td>
                <td>{{ asset[3] }}</td>
            </tr>

            <tr>
                <td>Standort</td>
                <td>{{ asset[4] }}</td>
            </tr>

            <tr>
                <td>Zimmer</td>
                <td>{{ asset[5] }}</td>
            </tr>

            <tr>
                <td>Organisationseinheit</td>
                <td>{{ asset[6] }}</td>
            </tr>

            <tr>
                <td>Mitarbeiter</td>
                <td>{{ asset[7] }}</td>
            </tr>

        </table>



        <br><br>
        <p><a href="javascript:history.back()">⬅️ Zurück</a></p>

        <p><a href="/assets"> 📦 Assets</a></p>

</html>
