<!DOCTYPE html>
<html>

<head>

    <title>IT Asset Management Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='dashboard.css') }}">

</head>

<body>
        <div class="logout">
            <a href="/logout">🚪 Logout</a>
        </div>
    <h2 style="text-align: center; color: #666;">
        Zentrum für LehrerInnenbildung
    </h2>

    <h1>
        💻 IT Asset Management Dashboard
    </h1>

    <div class="container">

        <div class="kachel">
            <div class="titel">📦 Assets</div>
            <div class="zahl">{{ assets }}</div>
        </div>

        <div class="kachel">
            <div class="titel">👤 Mitarbeiter</div>
            <div class="zahl">{{ mitarbeiter }}</div>
        </div>

        <div class="kachel">
            <div class="titel">✅ Ausgegeben</div>
            <div class="zahl">{{ ausgegeben }}</div>
        </div>

        <div class="kachel">
            <div class="titel">🏢 Im Lager</div>
            <div class="zahl">{{ lager }}</div>
        </div>

    </div>

    <div class="navigation">

        <a href="/assets">📦 Assets</a>
        <a href="/mitarbeiter">👤Mitarbeiter</a>
        <a href="/suche">🔍Suche</a>
        <a href="/infos">📊 Infos</a>
        <!--<a href="/historie">🚪 Historie</a>-->

    </div>

</body>

</html>
